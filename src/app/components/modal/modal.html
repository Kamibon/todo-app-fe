@if(isOpen()){
<div id="modalOverlay" class="fixed inset-0 bg-gray-500 bg-opacity-50 z-50">
  <div class="flex justify-center items-center h-full">
    <form
      [formRoot]="todoForm"
      class="bg-white text-gray-500 max-w-96 mx-4 md:p-6 p-4 text-left text-sm rounded-lg shadow-lg w-full"
    >
      <h2 class="text-2xl font-semibold mb-4 text-center text-gray-800">
        Crea un nuovo todo
      </h2>
      <label for="title">Titolo</label>
      <input
        id="title"
        class="w-full border mt-1 border-gray-500/30 outline-none rounded p-2"
        placeholder="Inserisci il titolo"
        [formField]="todoForm.title"
      />
      <textarea
        rows="4"
        id="desc"
        class="w-full border mt-3 resize-none border-gray-500/30 outline-none rounded p-2"
        placeholder="Inserisci la descrizione del todo"
        [formField]="todoForm.description"
      ></textarea>
      <label for="priority">Data di completamento</label>
      <input
        [formField]="todoForm.expirationDate"
        id="expirationDate"
        class="w-full border mt-1 resize-none border-gray-500/30 outline-none rounded p-2"
        type="date"
      />
      <label for="priority">Priorità</label>
      <select
        [formField]="todoForm.priority"
        id="priority"
        class="w-full border mt-1 resize-none border-gray-500/30 outline-none rounded p-2"
      >
        <option value="LOW">Bassa</option>
        <option value="MEDIUM">Media</option>
        <option value="HIGH">Alta</option>
      </select>
      <button
        type="submit"
        class="cursor-pointer w-full my-3 bg-indigo-500 hover:bg-indigo-600/90 active:scale-95 transition py-2.5 rounded text-white"
      >
        Crea todo
      </button>
      <button
        (click)="this.closeModal.emit()"
        id="closeModal"
        class="cursor-pointer w-full bg-red-500 hover:bg-red-600 text-white py-2.5 rounded mt-4"
      >
        Chiudi
      </button>
    </form>
  </div>
</div>
} @else {}
