<div
  class="rounded-3xl bg-gray-300 border border-blue-600 flex flex-col px-2 py-3 shadow-md"
>
  <div class="flex justify-between items-center">
    <span class="font-bold italic">{{ todo().title }}</span>
    <div
      class="rounded-full size-5 flex items-center justify-center text-white text-base"
      [ngClass]="{
        'bg-red-700': todo().status === Status.EXPIRED,
        'bg-green-600': todo().status === Status.COMPLETED,
        'bg-orange-400': todo().status === Status.INCOMPLETE,
      }"
    >
      {{
        todo().status === Status.EXPIRED
          ? "X"
          : todo().status === Status.COMPLETED
            ? "✓"
            : "-"
      }}
    </div>
  </div>
  <span>{{ todo().description }} </span>
  <button
    (click)="deleteThisTodo()"
    class="cursor-pointer rounded-2xl bg-red-600 hover:bg-red-500 mt-2 px-2 py-1 text-white"
  >
    Elimina
  </button>
</div>
